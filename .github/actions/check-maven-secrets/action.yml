name: Check Maven publishing secrets
description: >
  Verifies the four secrets required for Maven Central publishing.
  Fails the run when any is missing, so a release cannot pass silently unpublished.

inputs:
  maven-central-username:
    required: true
  maven-central-password:
    required: true
  gpg-private-key:
    required: true
  gpg-passphrase:
    required: true

outputs:
  ok:
    description: 'true if all secrets are present, false otherwise'
    value: ${{ steps.check.outputs.ok }}

runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        MAVEN_CENTRAL_USERNAME: ${{ inputs.maven-central-username }}
        MAVEN_CENTRAL_PASSWORD: ${{ inputs.maven-central-password }}
        GPG_PRIVATE_KEY:        ${{ inputs.gpg-private-key }}
        GPG_PASSPHRASE:         ${{ inputs.gpg-passphrase }}
      run: |
        missing=()
        [ -z "$MAVEN_CENTRAL_USERNAME" ] && missing+=("MAVEN_CENTRAL_USERNAME")
        [ -z "$MAVEN_CENTRAL_PASSWORD" ] && missing+=("MAVEN_CENTRAL_PASSWORD")
        [ -z "$GPG_PRIVATE_KEY" ]         && missing+=("GPG_PRIVATE_KEY")
        [ -z "$GPG_PASSPHRASE" ]          && missing+=("GPG_PASSPHRASE")
        # Fail, do not skip. A warning here left the publish job skipped and the run green: the
        # v0.1.0 staging run reported success having uploaded nothing.
        if [ ${#missing[@]} -ne 0 ]; then
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::error::Publish cannot run — missing secrets: ${missing[*]}"
          exit 1
        fi
        echo "ok=true" >> "$GITHUB_OUTPUT"
