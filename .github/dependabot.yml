version: 2
updates:
  # Gradle version catalog (gradle/libs.versions.toml) + the Gradle wrapper. Partner SDK bumps land
  # as PRs, so CI's 16 KB alignment audit and the minified demo build vet them before merge.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns:
          - "*"
      # Groups only cover version updates by default; security updates need their own group.
      gradle-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Keeps the SHA pins in .github/workflows/ current: Dependabot rewrites both the SHA and its
  # trailing version comment. The `ci` prefix keeps these bumps out of the changelog.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
