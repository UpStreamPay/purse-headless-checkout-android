name: CI

# Every pull request and every push to main runs the gates below. Branch protection on `main`
# requires all three jobs, so nothing merges on a build, test, API, style or static-analysis
# failure (SDK-12219 AC 4). See docs/contributing/ci.md.

on:
  pull_request:
  push:
    branches:
      - main

# Read-only is all the build needs. It also keeps a write-scoped GITHUB_TOKEN away from pull
# requests, whatever the repository default is.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Style, static analysis, API surface
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ktlint
        run: ./gradlew ktlintCheck --continue

      - name: detekt
        run: ./gradlew detekt --continue

      - name: Public API unchanged (apiCheck)
        run: ./gradlew apiCheck --continue

  build-and-test:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble every module
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Android lint
        run: ./gradlew lint --continue

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-lint-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release-consumer:
    name: Minified demo (R8) + 16 KB alignment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The consumer path a merchant's release build takes: R8 against the SDK's consumer rules.
      - name: Minified demo build
        run: ./gradlew :app:assembleRelease

      - name: Native libraries are 16 KB page aligned
        run: ./gradlew verify16kbAlignment

      - name: Publishable artifacts assemble (POM, sources, Dokka javadoc)
        run: ./gradlew publishToMavenLocal

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-release-apk
          path: app/build/outputs/apk/release/app-release.apk
