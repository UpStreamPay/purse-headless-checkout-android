name: CodeQL

# Advanced setup, not GitHub's default one: default setup's autobuild injects a Gradle init script
# (setup-proxy.gradle) that adds a Maven repository, and settings.gradle.kts refuses project
# repositories, so its Kotlin build failed (2026-09-25) and only the workflows were scanned. This
# workflow builds the published modules (:headless-checkout and the three :partner-* modules) with
# the same Gradle task as CI. The repository must have code scanning default setup *off*: GitHub
# rejects advanced-setup uploads while it is on.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read            # on a private repository, the action reads its own workflow run
      contents: read
      security-events: write   # upload the results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: 21

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL extracts Kotlin while the compiler runs, so the compile must really happen: no
      # Gradle build cache, no daemon left over from another step.
      - name: Build the published modules
        if: matrix.language == 'java-kotlin'
        run: |
          ./gradlew --no-daemon --no-build-cache \
            :headless-checkout:assembleDebug \
            :partner-googlepay:assembleDebug \
            :partner-klarna:assembleDebug \
            :partner-paypal:assembleDebug

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
