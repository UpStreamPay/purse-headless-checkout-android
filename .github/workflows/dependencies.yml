name: Dependencies

# Gradle dependencies are resolved, not declared in a manifest GitHub can read, so the dependency
# graph only knows them once this workflow submits them. On main that feeds Dependabot alerts; on a
# pull request it gives the review job the PR's own graph, and a new dependency with a known high
# or critical vulnerability blocks the merge (PCI-DSS 6.2.3). See docs/contributing/ci.md.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submission:
    name: Dependency submission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # the dependency submission API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

  review:
    name: Dependency review
    needs: submission
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The snapshot submitted by the job above can take a moment to be processed.
          retry-on-snapshot-warnings: true
