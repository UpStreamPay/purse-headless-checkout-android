name: Release to Maven Central

# Manual step: rebuilds the latest `v*` tag on main and publishes with automaticRelease so the Central
# Portal promotes the artifacts to Maven Central, then publishes the draft GitHub release.
# See docs/contributing/release.md.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Every release waits for a codeowner: the `release` environment requires a review from
    # @UpStreamPay/pci-dss, and only v* tags and main may deploy to it.
    environment: release
    permissions:
      contents: write   # publishes the draft GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # needed for git describe

      # In the gated job, so a release asks for one approval, not two. Fails on a missing secret.
      - uses: ./.github/actions/check-maven-secrets
        with:
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          gpg-private-key:        ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase:         ${{ secrets.GPG_PASSPHRASE }}

      # Publish the latest tag on main, built from that tag — not whatever the dispatched branch's
      # HEAD holds under the tag's version number.
      - name: Check out the latest release tag on main
        run: |
          TAG=$(git describe --tags --abbrev=0 --match 'v*' origin/main)
          git checkout --quiet "$TAG"
          echo "SDK_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey:          ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:  ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishAllPublicationsToMavenCentralRepository -PautoRelease=true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${SDK_VERSION}" --draft=false
