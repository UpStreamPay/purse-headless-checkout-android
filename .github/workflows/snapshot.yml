name: Snapshot

# Publishes the open release PR as <next-version>-SNAPSHOT to Central's snapshot repository, so the
# next release can be tested before it is merged. See docs/contributing/release.md#snapshots.

on:
  push:
    branches:
      - release-please--branches--main--components--headless-checkout-android

permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Holds a Central token of its own, deployable from the release-please branch only. No GPG key:
    # Central does not require signed snapshots.
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          [ -n "$MAVEN_CENTRAL_USERNAME" ] && [ -n "$MAVEN_CENTRAL_PASSWORD" ] \
            || { echo "::error::MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD missing from the staging environment."; exit 1; }

      # The release PR has already bumped the manifest to the next version.
      - name: Set SDK version
        run: |
          VERSION="$(jq -r '."."' .release-please-manifest.json)-SNAPSHOT"
          # A non-SNAPSHOT version would go to the Central Portal as a real release.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$ ]] \
            || { echo "::error::Refusing to publish '$VERSION' as a snapshot."; exit 1; }
          echo "SDK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # A -SNAPSHOT version makes the publish plugin target central.sonatype.com/repository/maven-snapshots/.
      - name: Publish snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew publishAllPublicationsToMavenCentralRepository

      - name: Summary
        run: |
          {
            echo "Published \`$SDK_VERSION\`:"
            echo '```kotlin'
            echo "implementation(\"eu.purse:headless-checkout-android:$SDK_VERSION\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
